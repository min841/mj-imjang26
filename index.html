<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mj-imjang26 | 부동산 임장일지</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-custom { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .star-rating { color: #ffc107; }
        .badge-check { background-color: #e8f5e9; color: #2e7d32; font-size: 0.78rem; padding: 4px 8px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; display: inline-block; }
        .badge-infra { background-color: #e3f2fd; color: #1565c0; font-size: 0.78rem; padding: 4px 8px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; display: inline-block; }
        .qa-comment { background-color: #f1f3f5; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; }
        .comment-btn { border: none; background: none; color: #6c757d; font-size: 0.75rem; padding: 0 4px; cursor: pointer; }
        .comment-btn:hover { color: #0d6efd; text-decoration: underline; }
        .comment-btn.delete:hover { color: #dc3545; }
        .chk-section-title { font-size: 0.85rem; font-weight: bold; color: #495057; margin-bottom: 6px; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 950px;">
    <!-- 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0">🏡 mj-imjang26 부동산 임장일지</h2>
        <button class="btn btn-primary fw-bold" onclick="openCompareModal()">⚖️ 매물 비교하기 (<span id="compareCount">0</span>)</button>
    </div>

    <!-- 대시보드 요약 -->
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="card card-custom p-3 text-center">
                <div class="text-muted small">총 임장 매물</div>
                <div class="fs-4 fw-bold" id="totalCount">0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="card card-custom p-3 text-center">
                <div class="text-muted small">평균 평점</div>
                <div class="fs-4 fw-bold text-warning" id="avgRating">0.0</div>
            </div>
        </div>
        <div class="col-4">
            <div class="card card-custom p-3 text-center">
                <div class="text-muted small">최근 작성</div>
                <div class="fs-6 fw-bold text-truncate" id="latestProperty">-</div>
            </div>
        </div>
    </div>

    <!-- 작성 및 수정 폼 -->
    <div class="card card-custom p-4 mb-4" id="formCard">
        <h4 class="fw-bold mb-3" id="formTitle">📝 새로운 임장일지 작성</h4>
        <form id="imjangForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">매물명 / 단지명 *</label>
                    <input type="text" id="title" class="form-control" placeholder="예: 래미안 푸르지오 101동 502호" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">매매 / 전세가 *</label>
                    <input type="text" id="price" class="form-control" placeholder="예: 매매 8억 5,000만" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">소재지 / 주소</label>
                    <input type="text" id="address" class="form-control" placeholder="주소를 입력하세요">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">평점 (1 ~ 5점)</label>
                    <select id="rating" class="form-select">
                        <option value="5">⭐⭐⭐⭐⭐ (5점 - 강추)</option>
                        <option value="4">⭐⭐⭐⭐ (4점 - 좋음)</option>
                        <option value="3" selected>⭐⭐⭐ (3점 - 보통)</option>
                        <option value="2">⭐⭐ (2점 - 아쉬움)</option>
                        <option value="1">⭐ (1점 - 비추)</option>
                    </select>
                </div>

                <!-- 확장 체크리스트 -->
                <div class="col-12">
                    <label class="form-label fw-semibold">체크리스트 점검</label>
                    <div class="p-3 bg-light rounded">
                        <!-- 내부 상태 -->
                        <div class="chk-section-title">🏠 내부 상태</div>
                        <div class="row g-2 mb-3">
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_sash"><label class="form-check-label" for="chk_sash">샷시/창호 상태</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_leak"><label class="form-check-label" for="chk_leak">누수 흔적 없음</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_mold"><label class="form-check-label" for="chk_mold">곰팡이/결로 없음</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_water"><label class="form-check-label" for="chk_water">수압/배수 굿</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_noise"><label class="form-check-label" for="chk_noise">층간/외부 소음 적음</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_underpark"><label class="form-check-label" for="chk_underpark">지하주차장 연결</label></div></div>
                        </div>

                        <!-- 주변 인프라 및 입지 -->
                        <div class="chk-section-title">🏪 주변 인프라 및 입지</div>
                        <div class="row g-2">
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_station"><label class="form-check-label" for="chk_station">지하철역 도보권</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_mart"><label class="form-check-label" for="chk_mart">대형마트 인근</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_school"><label class="form-check-label" for="chk_school">초/중/고 학교 인근</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_park"><label class="form-check-label" for="chk_park">공원/산책로</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_daiso"><label class="form-check-label" for="chk_daiso">다이소 도보권</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_oliveyoung"><label class="form-check-label" for="chk_oliveyoung">올리브영 도보권</label></div></div>
                            <div class="col-6 col-md-4"><div class="form-check"><input class="form-check-input chk" type="checkbox" id="chk_convenience"><label class="form-check-label" for="chk_convenience">편의점 가까움</label></div></div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">특이사항 및 상세 메모</label>
                    <textarea id="memo" class="form-control" rows="3" placeholder="남향, 일조량 우수, 로얄동, 인프라 동선 최고 등"></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="submitBtn">저장하기</button>
                    <button type="button" class="btn btn-outline-secondary d-none" id="cancelEditBtn" onclick="cancelEdit()">취소</button>
                </div>
            </div>
        </form>
    </div>

    <!-- 검색 및 뷰 모드 조절 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <input type="text" id="searchInput" class="form-control w-50" placeholder="🔍 매물명 또는 메모 검색..." oninput="filterImjangs()">
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-secondary active" id="btnCardView" onclick="setViewMode('card')">카드뷰</button>
            <button type="button" class="btn btn-outline-secondary" id="btnTableView" onclick="setViewMode('table')">테이블뷰</button>
        </div>
    </div>

    <!-- 매물 목록 영역 -->
    <div id="cardViewArea" class="row g-3"></div>
    <div id="tableViewArea" class="card card-custom p-3 d-none">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead>
                    <tr>
                        <th>선택</th>
                        <th>매물명</th>
                        <th>가격</th>
                        <th>평점</th>
                        <th>주요 특징</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="tableTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 매물 비교 모달 -->
<div class="modal fade" id="compareModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">⚖️ 매물 비교분석 (최대 3개)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="compareModalBody">
                <!-- 비교 내용 동적 생성 -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ 민정님의 mj-imjang26 프로젝트 Firebase 설정 정보
    const firebaseConfig = {
        apiKey: "AIzaSyCLVntOsMvUw8i15a1...", // Firebase 콘솔의 실제 API Key로 확인해 주세요!
        authDomain: "mj-imjang26.firebaseapp.com",
        projectId: "mj-imjang26",
        storageBucket: "mj-imjang26.firebasestorage.app",
        messagingSenderId: "116210774748",
        appId: "1:116210774748:web:56a35f941f932b24d4ba19"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allImjangs = [];
    let selectedCompareIds = [];
    let currentViewMode = 'card';
    let currentEditId = null;

    // 1. 실시간 데이터 불러오기
    const q = query(collection(db, "imjangs"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        allImjangs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        updateDashboard();
        renderImjangs();
    });

    // 2. 대시보드
    function updateDashboard() {
        document.getElementById('totalCount').innerText = allImjangs.length;
        if (allImjangs.length > 0) {
            const avg = (allImjangs.reduce((acc, cur) => acc + Number(cur.rating || 0), 0) / allImjangs.length).toFixed(1);
            document.getElementById('avgRating').innerText = avg;
            document.getElementById('latestProperty').innerText = allImjangs[0].title || '-';
        } else {
            document.getElementById('avgRating').innerText = '0.0';
            document.getElementById('latestProperty').innerText = '-';
        }
    }

    // 3. 목록 렌더링
    window.renderImjangs = function() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allImjangs.filter(item => 
            (item.title && item.title.toLowerCase().includes(searchText)) ||
            (item.memo && item.memo.toLowerCase().includes(searchText))
        );

        if (currentViewMode === 'card') {
            document.getElementById('cardViewArea').classList.remove('d-none');
            document.getElementById('tableViewArea').classList.add('d-none');
            
            document.getElementById('cardViewArea').innerHTML = filtered.map(item => `
                <div class="col-md-6">
                    <div class="card card-custom p-3 h-100 position-relative">
                        <div class="form-check position-absolute top-0 end-0 m-3">
                            <input class="form-check-input" type="checkbox" value="${item.id}" 
                                ${selectedCompareIds.includes(item.id) ? 'checked' : ''} 
                                onchange="toggleCompareSelect('${item.id}')">
                            <label class="form-check-label small fw-bold text-muted">비교</label>
                        </div>
                        <div class="d-flex justify-content-between align-items-start mb-2 me-4">
                            <h5 class="fw-bold m-0">${item.title}</h5>
                        </div>
                        <div class="mb-2"><span class="star-rating">${'⭐'.repeat(Number(item.rating || 0))}</span></div>
                        <div class="text-primary fw-bold mb-2 fs-5">${item.price}</div>
                        <div class="text-muted small mb-2">📍 ${item.address || '주소 미입력'}</div>
                        
                        <!-- 체크리스트 태그들 -->
                        <div class="mb-2">
                            ${item.checklist?.chk_sash ? '<span class="badge-check">샷시양호</span>' : ''}
                            ${item.checklist?.chk_leak ? '<span class="badge-check">누수없음</span>' : ''}
                            ${item.checklist?.chk_mold ? '<span class="badge-check">곰팡이없음</span>' : ''}
                            ${item.checklist?.chk_water ? '<span class="badge-check">수압양호</span>' : ''}
                            ${item.checklist?.chk_noise ? '<span class="badge-check">소음없음</span>' : ''}
                            ${item.checklist?.chk_underpark ? '<span class="badge-check">지하주차장</span>' : ''}
                            ${item.checklist?.chk_station ? '<span class="badge-infra">지하철역</span>' : ''}
                            ${item.checklist?.chk_mart ? '<span class="badge-infra">대형마트</span>' : ''}
                            ${item.checklist?.chk_school ? '<span class="badge-infra">학교</span>' : ''}
                            ${item.checklist?.chk_park ? '<span class="badge-infra">공원</span>' : ''}
                            ${item.checklist?.chk_daiso ? '<span class="badge-infra">다이소</span>' : ''}
                            ${item.checklist?.chk_oliveyoung ? '<span class="badge-infra">올리브영</span>' : ''}
                            ${item.checklist?.chk_convenience ? '<span class="badge-infra">편의점</span>' : ''}
                        </div>
                        
                        <p class="text-secondary small flex-grow-1 border-top pt-2 mt-1 mb-2">${item.memo || '메모 없음'}</p>
                        
                        <!-- 댓글/Q&A -->
                        <div class="border-top pt-2 mt-2">
                            <div class="fw-semibold small mb-1">💬 의견 / Q&A</div>
                            <div class="d-flex flex-column gap-1 mb-2">
                                ${(item.comments || []).map((c, idx) => `
                                    <div class="qa-comment d-flex justify-content-between align-items-center">
                                        <div><strong>${c.author}:</strong>${c.text}</div>
                                        <div class="ms-2 text-nowrap">
                                            <button class="comment-btn" onclick="editComment('${item.id}',${idx})">수정</button>
                                            <button class="comment-btn delete" onclick="deleteComment('${item.id}',${idx})">삭제</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="input-group input-group-sm">
                                <select class="form-select" id="author_${item.id}" style="max-width: 80px;">
                                    <option value="나">나</option>
                                    <option value="동생">동생</option>
                                </select>
                                <input type="text" class="form-control" id="commentInput_${item.id}" placeholder="댓글 남기기...">
                                <button class="btn btn-outline-primary" onclick="addComment('${item.id}')">등록</button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top">
                            <button class="btn btn-sm btn-outline-primary" onclick="editImjang('${item.id}')">수정</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteImjang('${item.id}')">삭제</button>
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            document.getElementById('cardViewArea').classList.add('d-none');
            document.getElementById('tableViewArea').classList.remove('d-none');

            document.getElementById('tableTbody').innerHTML = filtered.map(item => `
                <tr>
                    <td>
                        <input class="form-check-input" type="checkbox" value="${item.id}" 
                            ${selectedCompareIds.includes(item.id) ? 'checked' : ''} 
                            onchange="toggleCompareSelect('${item.id}')">
                    </td>
                    <td class="fw-bold">${item.title}</td>
                    <td class="text-primary fw-bold">${item.price}</td>
                    <td><span class="star-rating">${'⭐'.repeat(Number(item.rating || 0))}</span></td>
                    <td class="small text-truncate" style="max-width: 200px;">${item.memo || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editImjang('${item.id}')">수정</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteImjang('${item.id}')">삭제</button>
                    </td>
                </tr>
            `).join('');
        }
    };

    // 4. 비교 매물 선택 관리
    window.toggleCompareSelect = function(id) {
        if (selectedCompareIds.includes(id)) {
            selectedCompareIds = selectedCompareIds.filter(i => i !== id);
        } else {
            if (selectedCompareIds.length >= 3) {
                alert("비교는 최대 3개 매물까지 선택 가능합니다.");
                renderImjangs();
                return;
            }
            selectedCompareIds.push(id);
        }
        document.getElementById('compareCount').innerText = selectedCompareIds.length;
    };

    // 5. 비교 모달 열기
    window.openCompareModal = function() {
        if (selectedCompareIds.length < 2) {
            alert("비교할 매물을 최소 2개 이상 선택해 주세요!");
            return;
        }

        const items = allImjangs.filter(i => selectedCompareIds.includes(i.id));
        
        let html = `<div class="table-responsive"><table class="table table-bordered text-center align-middle"><thead><tr><th style="width:150px;">구분</th>`;
        items.forEach(item => {
            html += `<th class="fs-5">${item.title}</th>`;
        });
        html += `</tr></thead><tbody>`;

        html += `<tr><td class="fw-bold bg-light">가격</td>` + items.map(i => `<td class="text-primary fw-bold fs-6">${i.price}</td>`).join('') + `</tr>`;
        html += `<tr><td class="fw-bold bg-light">평점</td>` + items.map(i => `<td>⭐ ${i.rating}점</td>`).join('') + `</tr>`;
        html += `<tr><td class="fw-bold bg-light">주소</td>` + items.map(i => `<td class="small">${i.address || '-'}</td>`).join('') + `</tr>`;
        
        const chkList = [
            { key: 'chk_sash', label: '샷시 상태' },
            { key: 'chk_leak', label: '누수 없음' },
            { key: 'chk_mold', label: '곰팡이 없음' },
            { key: 'chk_water', label: '수압 양호' },
            { key: 'chk_noise', label: '소음 적음' },
            { key: 'chk_underpark', label: '지하주차장' },
            { key: 'chk_station', label: '지하철역' },
            { key: 'chk_mart', label: '대형마트' },
            { key: 'chk_school', label: '학교' },
            { key: 'chk_park', label: '공원' },
            { key: 'chk_daiso', label: '다이소' },
            { key: 'chk_oliveyoung', label: '올리브영' },
            { key: 'chk_convenience', label: '편의점' }
        ];

        chkList.forEach(c => {
            html += `<tr><td class="fw-bold bg-light">${c.label}</td>` + 
                items.map(i => `<td>${i.checklist?.[c.key] ? '✅' : '❌'}</td>`).join('') + `</tr>`;
        });

        html += `<tr><td class="fw-bold bg-light">상세 메모</td>` + items.map(i => `<td class="small text-start">${i.memo || '-'}</td>`).join('') + `</tr>`;
        html += `</tbody></table></div>`;

        document.getElementById('compareModalBody').innerHTML = html;
        const modal = new bootstrap.Modal(document.getElementById('compareModal'));
        modal.show();
    };

    // 6. 저장 / 수정 제출
    document.getElementById('imjangForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const checklistData = {
            chk_sash: document.getElementById('chk_sash').checked,
            chk_leak: document.getElementById('chk_leak').checked,
            chk_mold: document.getElementById('chk_mold').checked,
            chk_water: document.getElementById('chk_water').checked,
            chk_noise: document.getElementById('chk_noise').checked,
            chk_underpark: document.getElementById('chk_underpark').checked,
            chk_station: document.getElementById('chk_station').checked,
            chk_mart: document.getElementById('chk_mart').checked,
            chk_school: document.getElementById('chk_school').checked,
            chk_park: document.getElementById('chk_park').checked,
            chk_daiso: document.getElementById('chk_daiso').checked,
            chk_oliveyoung: document.getElementById('chk_oliveyoung').checked,
            chk_convenience: document.getElementById('chk_convenience').checked,
        };

        const formData = {
            title: document.getElementById('title').value,
            price: document.getElementById('price').value,
            address: document.getElementById('address').value,
            rating: document.getElementById('rating').value,
            memo: document.getElementById('memo').value,
            checklist: checklistData,
            updatedAt: new Date()
        };

        try {
            if (currentEditId) {
                await updateDoc(doc(db, "imjangs", currentEditId), formData);
                alert("일지가 수정되었습니다!");
                cancelEdit();
            } else {
                formData.createdAt = new Date();
                formData.comments = [];
                await addDoc(collection(db, "imjangs"), formData);
                alert("새 일지가 등록되었습니다!");
            }
            resetForm();
        } catch (err) {
            console.error("저장 실패:", err);
            alert("저장 실패: " + err.message);
        }
    });

    // 7. 매물 수정 모드
    window.editImjang = function(id) {
        const item = allImjangs.find(i => i.id === id);
        if (!item) return;

        currentEditId = id;
        document.getElementById('formTitle').innerText = "✏️ 임장일지 수정하기";
        document.getElementById('submitBtn').innerText = "수정 완료하기";
        document.getElementById('cancelEditBtn').classList.remove('d-none');

        document.getElementById('title').value = item.title || '';
        document.getElementById('price').value = item.price || '';
        document.getElementById('address').value = item.address || '';
        document.getElementById('rating').value = item.rating || '3';
        document.getElementById('memo').value = item.memo || '';

        if (item.checklist) {
            const keys = ['chk_sash', 'chk_leak', 'chk_mold', 'chk_water', 'chk_noise', 'chk_underpark', 'chk_station', 'chk_mart', 'chk_school', 'chk_park', 'chk_daiso', 'chk_oliveyoung', 'chk_convenience'];
            keys.forEach(k => {
                const el = document.getElementById(k);
                if (el) el.checked = !!item.checklist[k];
            });
        }

        document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    };

    window.cancelEdit = function() {
        currentEditId = null;
        document.getElementById('formTitle').innerText = "📝 새로운 임장일지 작성";
        document.getElementById('submitBtn').innerText = "저장하기";
        document.getElementById('cancelEditBtn').classList.add('d-none');
        resetForm();
    };

    function resetForm() {
        document.getElementById('imjangForm').reset();
    }

    // 8. 매물 삭제
    window.deleteImjang = async function(id) {
        if (confirm("정말 이 일지를 삭제하시겠습니까?")) {
            await deleteDoc(doc(db, "imjangs", id));
        }
    };

    // 9. 댓글/Q&A 추가
    window.addComment = async function(id) {
        const author = document.getElementById(`author_${id}`).value;
        const input = document.getElementById(`commentInput_${id}`);
        const text = input.value.trim();

        if (!text) return;

        const item = allImjangs.find(i => i.id === id);
        if (!item) return;

        const updatedComments = item.comments || [];
        updatedComments.push({ author, text, createdAt: new Date().toISOString() });

        await updateDoc(doc(db, "imjangs", id), { comments: updatedComments });
        input.value = '';
    };

    // 10. 댓글 수정
    window.editComment = async function(id, commentIdx) {
        const item = allImjangs.find(i => i.id === id);
        if (!item || !item.comments || !item.comments[commentIdx]) return;

        const currentComment = item.comments[commentIdx];
        const newText = prompt("댓글 내용을 수정하세요:", currentComment.text);

        if (newText !== null && newText.trim() !== "") {
            const updatedComments = [...item.comments];
            updatedComments[commentIdx].text = newText.trim();

            await updateDoc(doc(db, "imjangs", id), { comments: updatedComments });
        }
    };

    // 11. 댓글 삭제
    window.deleteComment = async function(id, commentIdx) {
        if (!confirm("이 댓글을 삭제하시겠습니까?")) return;

        const item = allImjangs.find(i => i.id === id);
        if (!item || !item.comments) return;

        const updatedComments = item.comments.filter((_, idx) => idx !== commentIdx);
        await updateDoc(doc(db, "imjangs", id), { comments: updatedComments });
    };

    // 12. 뷰 모드 설정 및 검색
    window.setViewMode = function(mode) {
        currentViewMode = mode;
        document.getElementById('btnCardView').classList.toggle('active', mode === 'card');
        document.getElementById('btnTableView').classList.toggle('active', mode === 'table');
        renderImjangs();
    };

    window.filterImjangs = function() {
        renderImjangs();
    };
</script>
</body>
</html>
