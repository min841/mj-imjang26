<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 임장 일지 & 매물 비교</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
            }
            .page-break {
                page-break-before: always;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-700">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants for surrounding amenities check
        const SURROUNDINGS_ITEMS = [
            { id: 'mart', label: '대형마트', icon: 'shopping-cart' },
            { id: 'daiso', label: '다이소', icon: 'shopping-bag' },
            { id: 'oliveyoung', label: '올리브영', icon: 'sparkles' },
            { id: 'cafe', label: '카페', icon: 'coffee' },
            { id: 'school', label: '학교', icon: 'graduation-cap' },
            { id: 'park', label: '공원', icon: 'trees' },
            { id: 'transit', label: '교통(역/버스)', icon: 'bus' }
        ];

        // Constants for interior check items
        const INTERIOR_ITEMS = [
            { id: 'water', label: '수압 및 배수', desc: '주방, 욕실 수압 및 물 빠짐 상태' },
            { id: 'leak', label: '누수 및 곰팡이', desc: '천장, 창틀 주변, 베란다 습기/곰팡이' },
            { id: 'sunlight', label: '햇빛 / 채광', desc: '채광 상태 및 동간 거리, 조망' },
            { id: 'noise', label: '소음 및 악취', desc: '층간소음, 도로/외부 소음, 하수구 냄새' },
            { id: 'window', label: '샤시 및 창문', desc: '창문 틈새 바람, 이중창 여부 및 단열' },
            { id: 'heating', label: '난방 및 에어컨', desc: '보일러 연식, 난방 방식, 에어컨 위치' }
        ];

        // Initial Sample Data for user
        const INITIAL_LOGS = [
            {
                id: 'log-1',
                title: '반포 자이 84㎡ A타입 104동',
                propertyName: '반포 자이 아파트 104동',
                priceType: '매매',
                price: '32억 5,000만원',
                targetPrice: '31억 8,000만원',
                address: '서울특별시 서초구 신반포로 270',
                area: '84.98㎡ (약 34평)',
                floorInfo: '15층 / 29층',
                direction: '남향',
                moveInDate: '2026년 12월 협의가능',
                surroundings: {
                    mart: true,
                    daiso: true,
                    oliveyoung: true,
                    cafe: true,
                    school: true,
                    park: true,
                    transit: true
                },
                surroundingsMemo: '고속터미널역 도보 5분 거리, 단지 내 초등학교 포함되어 초품아 입지 최고임. 대로변 가깝지만 동 위치가 안쪽이라 조용함.',
                interiorChecks: {
                    water: { status: 'good', memo: '수압 매우 강함, 욕실 배수 양호' },
                    leak: { status: 'good', memo: '누수 흔적 없음, 베란다 결로 깨끗함' },
                    sunlight: { status: 'good', memo: '남향으로 정오에 채광 우수함' },
                    noise: { status: 'average', memo: '단지 내 놀이터 소음 약간 있음' },
                    window: { status: 'good', memo: 'KCC 시스템 창로 교체 완료됨' },
                    heating: { status: 'good', memo: '개별난방 보일러 2년 전 교체됨' }
                },
                photos: [
                    { id: 'p1', url: 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=80', caption: '거실 전경' },
                    { id: 'p2', url: 'https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=800&q=80', caption: '주방 및 식당 공간' }
                ],
                overallRating: 5,
                verdict: '강력추천',
                pros: '1. 지하철역 7/9호선 더블역세권\n2. 올수리 완료되어 추가 리모델링 비용 없음\n3. 일조권 및 단지 조경 훌륭함',
                cons: '1. 희망 매매가가 시세 상단에 위치함\n2. 주차 공간 야간엔 약간 혼잡함',
                questions: [
                    { id: 'q1', text: '세입자 만기일 및 퇴거 확정 여부', done: true, answer: '26년 11월 30일 퇴거 확정됨' },
                    { id: 'q2', text: '발코니 확장 공사 시 구청 신고 여부', done: true, answer: '정식 신고 승인 완료' }
                ],
                comments: [
                    { id: 'c1', text: '집주인분이 가격 협상 5천만원 정도는 여지가 있다고 말씀하심.', date: '2026-10-05 14:30' }
                ]
            },
            {
                id: 'log-2',
                title: '마포 프레스티지 자이 59㎡',
                propertyName: '마포 프레스티지 자이 202동',
                priceType: '전세',
                price: '8억 5,000만원',
                targetPrice: '8억 2,000만원',
                address: '서울특별시 마포구 염리동 507',
                area: '59.92㎡ (약 25평)',
                floorInfo: '8층 / 27층',
                direction: '남동향',
                moveInDate: '즉시 입주 가능',
                surroundings: {
                    mart: true,
                    daiso: true,
                    oliveyoung: true,
                    cafe: true,
                    school: true,
                    park: false,
                    transit: true
                },
                surroundingsMemo: '이대역 도보 6분, 주변 상권 활발함. 대형 공원은 도보로 가기 약간 멀지만 단지 내 산책로 잘 되어 있음.',
                interiorChecks: {
                    water: { status: 'good', memo: '수압 정상' },
                    leak: { status: 'average', memo: '안방 창틀 밑 약간의 벽지 들뜸 확인' },
                    sunlight: { status: 'good', memo: '오전 채광 좋음' },
                    noise: { status: 'good', memo: '외부 소음 차단 양호' },
                    window: { status: 'good', memo: '기본 샷시 상태 양호' },
                    heating: { status: 'average', memo: '에어컨은 거실에만 시스템 에어컨 설치됨' }
                },
                photos: [
                    { id: 'p3', url: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&q=80', caption: '단지 입구' }
                ],
                overallRating: 4,
                verdict: '관심매물',
                pros: '1. 신축 아파트라 입주 조건 최상\n2. 직주근접 (여의도, 광화문 출퇴근 편리)',
                cons: '1. 전세가율이 주변 시세 대비 높은 편\n2. 방 1개 크기가 살짝 작음',
                questions: [
                    { id: 'q3', text: '전세자금대출 및 보증보험 가입 가능 여부', done: true, answer: 'HUG 보증보험 가능 매물' }
                ],
                comments: []
            }
        ];

        const generateId = () => 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);

        const createNewLogTemplate = () => ({
            id: generateId(),
            title: '신규 임장 매물 ' + new Date().toLocaleDateString('ko-KR'),
            propertyName: '',
            priceType: '매매',
            price: '',
            targetPrice: '',
            address: '',
            area: '',
            floorInfo: '',
            direction: '',
            moveInDate: '',
            surroundings: {
                mart: false,
                daiso: false,
                oliveyoung: false,
                cafe: false,
                school: false,
                park: false,
                transit: false
            },
            surroundingsMemo: '',
            interiorChecks: {
                water: { status: 'good', memo: '' },
                leak: { status: 'good', memo: '' },
                sunlight: { status: 'good', memo: '' },
                noise: { status: 'good', memo: '' },
                window: { status: 'good', memo: '' },
                heating: { status: 'good', memo: '' }
            },
            photos: [],
            overallRating: 4,
            verdict: '관심매물',
            pros: '',
            cons: '',
            questions: [],
            comments: []
        });

        function App() {
            const [logs, setLogs] = useState(() => {
                const saved = localStorage.getItem('imjang_logs_v2');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return INITIAL_LOGS;
            });

            const [selectedId, setSelectedId] = useState(logs[0]?.id || null);
            const [viewMode, setViewMode] = useState('detail'); // 'detail' | 'compare'
            const [compareIds, setCompareIds] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterType, setFilterType] = useState('ALL');
            const [toast, setToast] = useState(null);

            // Save to LocalStorage
            useEffect(() => {
                localStorage.setItem('imjang_logs_v2', JSON.stringify(logs));
            }, [logs]);

            // Sync comparison list default
            useEffect(() => {
                if (compareIds.length === 0 && logs.length > 0) {
                    setCompareIds(logs.slice(0, 3).map(l => l.id));
                }
            }, [logs]);

            // Re-render Lucide icons on DOM update
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const activeLog = logs.find(l => l.id === selectedId) || logs[0];

            const handleCreateNew = () => {
                const newLog = createNewLogTemplate();
                newLog.propertyName = '신규 매물 ' + (logs.length + 1);
                setLogs([newLog, ...logs]);
                setSelectedId(newLog.id);
                setViewMode('detail');
                showToast('새 임장 일지가 생성되었습니다.');
            };

            const handleUpdateLog = (updated) => {
                setLogs(logs.map(l => l.id === updated.id ? updated : l));
            };

            const handleDeleteLog = (id) => {
                if (logs.length <= 1) {
                    showToast('최소 하나의 매물 일지는 유지되어야 합니다.');
                    return;
                }
                const filtered = logs.filter(l => l.id !== id);
                setLogs(filtered);
                setSelectedId(filtered[0].id);
                setCompareIds(compareIds.filter(i => i !== id));
                showToast('임장 일지가 삭제되었습니다.');
            };

            const handleToggleCompare = (id) => {
                if (compareIds.includes(id)) {
                    if (compareIds.length <= 1) {
                        showToast('비교를 위해 최소 1개 이상의 매물이 필요합니다.');
                        return;
                    }
                    setCompareIds(compareIds.filter(i => i !== id));
                } else {
                    if (compareIds.length >= 4) {
                        showToast('최대 4개 매물까지 동시 비교가 가능합니다.');
                        return;
                    }
                    setCompareIds([...compareIds, id]);
                }
            };

            const filteredLogs = logs.filter(log => {
                const name = (log.propertyName || log.title || '').toLowerCase();
                const addr = (log.address || '').toLowerCase();
                const term = searchTerm.toLowerCase();
                const matchesSearch = name.includes(term) || addr.includes(term);
                const matchesType = filterType === 'ALL' || log.priceType === filterType;
                return matchesSearch && matchesType;
            });

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3 animate-bounce text-sm">
                            <span className="w-2 h-2 rounded-full bg-blue-400"></span>
                            <span>{toast}</span>
                        </div>
                    )}

                    {}
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-sm">
                                    <i data-lucide="building-2" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">부동산 임장 노트</h1>
                                    <p className="text-xs text-slate-400 hidden sm:block">현장 점검, 체크리스트 & 매물 비교 분석</p>
                                </div>
                            </div>

                            {/* View Controls & Action Buttons */}
                            <div className="flex items-center gap-2 sm:gap-3">
                                <div className="bg-slate-800 p-1 rounded-xl border border-slate-700 flex text-xs font-semibold">
                                    <button
                                        onClick={() => setViewMode('detail')}
                                        className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition ${viewMode === 'detail' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                    >
                                        <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                                        <span>상세 일지</span>
                                    </button>
                                    <button
                                        onClick={() => setViewMode('compare')}
                                        className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition ${viewMode === 'compare' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                    >
                                        <i data-lucide="columns" className="w-3.5 h-3.5"></i>
                                        <span>매물 비교 ({compareIds.length})</span>
                                    </button>
                                </div>

                                <button
                                    onClick={handleCreateNew}
                                    className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow-sm flex items-center gap-1.5"
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span className="hidden sm:inline">새 일지 작성</span>
                                </button>

                                <button
                                    onClick={() => window.print()}
                                    className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs sm:text-sm font-semibold transition border border-slate-700 flex items-center gap-1.5"
                                    title="인쇄 및 PDF 저장"
                                >
                                    <i data-lucide="printer" className="w-4 h-4"></i>
                                    <span className="hidden md:inline">인쇄/PDF</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex-1 flex flex-col md:flex-row gap-6">
                        
                        {/* Sidebar: Property List & Filter */}
                        <aside className="w-full md:w-80 flex-shrink-0 space-y-4 no-print">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="relative">
                                    <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                    <input
                                        type="text"
                                        placeholder="매물명, 주소 검색..."
                                        value={searchTerm}
                                        onChange={e => setSearchTerm(e.target.value)}
                                        className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>

                                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold text-slate-600">
                                    {['ALL', '매매', '전세', '월세'].map(type => (
                                        <button
                                            key={type}
                                            onClick={() => setFilterType(type)}
                                            className={`flex-1 py-1 rounded-lg transition ${filterType === type ? 'bg-white shadow text-blue-600 font-bold' : 'hover:bg-slate-200'}`}
                                        >
                                            {type === 'ALL' ? '전체' : type}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Property List Cards */}
                            <div className="space-y-2.5 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
                                {filteredLogs.length === 0 ? (
                                    <div className="text-center py-10 bg-white rounded-2xl border border-slate-200 text-slate-400 text-xs">
                                        검색 조건에 맞는 매물이 없습니다.
                                    </div>
                                ) : (
                                    filteredLogs.map(log => {
                                        const isSelected = activeLog && activeLog.id === log.id && viewMode === 'detail';
                                        const isCompared = compareIds.includes(log.id);

                                        return (
                                            <div
                                                key={log.id}
                                                onClick={() => {
                                                    setSelectedId(log.id);
                                                    if (viewMode === 'compare') {
                                                        handleToggleCompare(log.id);
                                                    }
                                                }}
                                                className={`p-3.5 rounded-2xl border cursor-pointer transition relative ${isSelected ? 'border-blue-500 bg-blue-50/50 shadow-md ring-2 ring-blue-200' : isCompared && viewMode === 'compare' ? 'border-indigo-500 bg-indigo-50/40' : 'border-slate-200 bg-white hover:border-slate-300 shadow-sm'}`}
                                            >
                                                <div className="flex items-center justify-between gap-2 mb-1.5">
                                                    <span className={`px-2 py-0.5 rounded-md text-[11px] font-bold ${log.priceType === '매매' ? 'bg-red-100 text-red-700' : log.priceType === '전세' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                        {log.priceType}
                                                    </span>

                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleToggleCompare(log.id);
                                                        }}
                                                        className={`text-xs px-2 py-0.5 rounded-lg flex items-center gap-1 font-semibold transition ${isCompared ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                                    >
                                                        <i data-lucide={isCompared ? "check-square" : "square"} className="w-3.5 h-3.5"></i>
                                                        <span>비교</span>
                                                    </button>
                                                </div>

                                                <h3 className="font-bold text-slate-800 text-sm line-clamp-1">
                                                    {log.propertyName || '매물명 미정'}
                                                </h3>
                                                <p className="text-xs text-slate-500 line-clamp-1 mt-0.5">
                                                    {log.address || '주소 미입력'}
                                                </p>

                                                <div className="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                                                    <span className="font-bold text-blue-600">{log.price || '가격 미정'}</span>
                                                    <span className="text-amber-500 font-semibold flex items-center gap-0.5">
                                                        ★ {log.overallRating}점
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </aside>

                        {/* Main Editor or Compare View */}
                        <main className="flex-1">
                            {viewMode === 'compare' ? (
                                <CompareView
                                    logs={logs}
                                    compareIds={compareIds}
                                    onToggleCompare={handleToggleCompare}
                                    onSelectDetail={(id) => {
                                        setSelectedId(id);
                                        setViewMode('detail');
                                    }}
                                />
                            ) : activeLog ? (
                                <LogDetailEditor
                                    log={activeLog}
                                    onUpdate={handleUpdateLog}
                                    onDelete={handleDeleteLog}
                                />
                            ) : (
                                <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-400">
                                    선택된 매물이 없습니다.
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        function LogDetailEditor({ log, onUpdate, onDelete }) {
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            const fileInputRef = useRef(null);

            const handleChange = (field, value) => {
                onUpdate({ ...log, [field]: value });
            };

            const handleSurroundingToggle = (id) => {

                            <div className="flex items-center gap-2 text-slate-800 font-bold text-base border-l-4 border-cyan-500 pl-3">
                                <i data-lucide="help-circle" className="w-5 h-5 text-cyan-600"></i>
                                <h3>6. 중개사/집주인 질문 리스트 & 메모 댓글</h3>
                            </div>

                            <button
                                type="button"
                                onClick={handleAddQuestion}
                                className="no-print px-3 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-semibold shadow-sm transition flex items-center gap-1"
                            >
                                <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                <span>질문 추가</span>
                            </button>
                        </div>

                        {/* Questions Checklist */}
                        <div className="space-y-2">
                            {(!log.questions || log.questions.length === 0) ? (
                                <p className="text-xs text-slate-400 italic">추가된 질문이 없습니다. 중개업소 방문 전 확인할 질문을 추가해 보세요.</p>
                            ) : (
                                log.questions.map(q => (
                                    <div key={q.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="checkbox"
                                                checked={q.done || false}
                                                onChange={e => handleUpdateQuestion(q.id, 'done', e.target.checked)}
                                                className="w-4 h-4 text-cyan-600 rounded focus:ring-cyan-500"
                                            />
                                            <input
                                                type="text"
                                                value={q.text || ''}
                                                onChange={e => handleUpdateQuestion(q.id, 'text', e.target.value)}
                                                placeholder="확인할 질문 내용 (예: 세입자 퇴거일)"
                                                className={`flex-1 text-xs font-bold bg-transparent border-b border-transparent focus:border-cyan-500 focus:outline-none ${q.done ? 'line-through text-slate-400' : 'text-slate-800'}`}
                                            />
                                            <button
                                                type="button"
                                                onClick={() => handleDeleteQuestion(q.id)}
                                                className="no-print text-slate-400 hover:text-red-500 p-1"
                                            >
                                                <i data-lucide="trash" className="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>

                                        <input
                                            type="text"
                                            value={q.answer || ''}
                                            onChange={e => handleUpdateQuestion(q.id, 'answer', e.target.value)}
                                            placeholder="답변 및 내용 기재..."
                                            className="w-full text-xs text-slate-600 bg-white border border-slate-200 rounded-lg px-2.5 py-1 focus:ring-1 focus:ring-cyan-500 focus:outline-none"
                                        />
                                    </div>
                                ))
                            )}
                        </div>

                        {/* Comments Stream */}
                        <div className="mt-6 space-y-3">
                            <h4 className="text-xs font-bold text-slate-700 flex items-center gap-1">
                                <i data-lucide="message-square" className="w-4 h-4 text-slate-500"></i>
                                현장 기록 댓글 ({log.comments?.length || 0})
                            </h4>

                            <div className="flex gap-2 no-print">
                                <input
                                    type="text"
                                    value={newComment}
                                    onChange={e => setNewComment(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleAddComment()}
                                    placeholder="추가적인 메모나 수시 기록을 입력하세요..."
                                    className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-cyan-500 focus:outline-none"
                                />
                                <button
                                    type="button"
                                    onClick={handleAddComment}
                                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition"
                                >
                                    등록
                                </button>
                            </div>

                            <div className="space-y-2">
                                {log.comments?.map(c => (
                                    <div key={c.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                                        <div className="flex justify-between text-[10px] text-slate-400 mb-1">
                                            <span>작성 메모</span>
                                            <span>{c.date}</span>
                                        </div>
                                        <p className="text-slate-700 font-medium whitespace-pre-wrap">{c.text}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </section>
                </div>
            );
        }

        function CompareView({ logs, compareIds, onToggleCompare, onSelectDetail }) {
            const comparedLogs = logs.filter(l => compareIds.includes(l.id));

            return (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-8 space-y-6">
                    {/* Header Controls */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
                        <div>
                            <div className="flex items-center gap-2 text-indigo-600 font-black text-lg">
                                <i data-lucide="columns" className="w-6 h-6"></i>
                                <h2>매물 비교 분석 Matrix (Side-by-Side)</h2>
                            </div>
                            <p className="text-xs text-slate-500 mt-0.5">
                                선택한 매물들의 희망가, 입지 충족도, 내부 상태 및 장단점을 한눈에 비교해보세요.
                            </p>
                        </div>

                        <div className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 self-start sm:self-auto">
                            선택된 매물: <span className="text-indigo-600 font-black">{comparedLogs.length}개</span> (최대 4개)
                        </div>
                    </div>

                    {comparedLogs.length === 0 ? (
                        <div className="py-16 text-center text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                            <i data-lucide="layers" className="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
                            <p className="font-bold text-slate-600 text-sm">비교할 매물이 선택되지 않았습니다.</p>
                            <p className="text-xs text-slate-400 mt-1">좌측 목록에서 [비교] 버튼을 눌러 매물을 선택해 주세요.</p>
                        </div>
                    ) : (
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse text-left min-w-[700px]">
                                <thead>
                                    <tr>
                                        <th className="w-48 p-3 bg-slate-100 border border-slate-200 text-xs font-bold text-slate-700 rounded-tl-xl">
                                            비교 항목
                                        </th>
                                        {comparedLogs.map((log) => (
                                            <th key={log.id} className="p-4 bg-slate-50 border border-slate-200 min-w-[220px] align-top">
                                                <div className="space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.priceType === '매매' ? 'bg-red-100 text-red-700' : log.priceType === '전세' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                            {log.priceType}
                                                        </span>
                                                        <button
                                                            onClick={() => onToggleCompare(log.id)}
                                                            className="text-slate-400 hover:text-red-500 p-0.5"
                                                            title="비교에서 제외"
                                                        >
                                                            <i data-lucide="x" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>

                                                    {/* Thumbnail */}
                                                    <div className="h-28 w-full bg-slate-200 rounded-xl overflow-hidden flex items-center justify-center relative">
                                                        {log.photos && log.photos.length > 0 ? (
                                                            <img src={log.photos[0].url} alt={log.propertyName} className="w-full h-full object-cover" />
                                                        ) : (
                                                            <i data-lucide="building" className="w-8 h-8 text-slate-400"></i>
                                                        )}
                                                    </div>

                                                    <h3 className="font-bold text-slate-800 text-sm line-clamp-1">
                                                        {log.propertyName || '매물명 미정'}
                                                    </h3>
                                                    <p className="text-xs text-slate-500 line-clamp-1">{log.address || '주소 미입력'}</p>

                                                    <button
                                                        onClick={() => onSelectDetail(log.id)}
                                                        className="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1 shadow-sm mt-2"
                                                    >
                                                        <span>상세일지 수정</span>
                                                        <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                                                    </button>
                                                </div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="text-xs divide-y divide-slate-200">
                                    {/* 1. 가격 정보 */}
                                    <tr className="bg-slate-50/50">
                                        <td className="p-3 font-bold text-slate-700 border border-slate-200 bg-slate-100/50">
                                            💰 희망가 / 네고목표
                                        </td>
                                        {comparedLogs.map((log) => (
                                            <td key={log.id} className="p-3 border border-slate-200 font-semibold">
                                                <div className="text-blue-600 font-bold text-sm">{log.price || '미정'}</div>
                                                <div className="text-[11px] text-slate-500 mt-0.5">목표: {log.targetPrice || '미설정'}</div>
                                            </td>
                                        ))}
                                    </tr>

                                    {/* 2. 평형 및 층수 */}
                                    <tr>
                                        <td className="p-3 font-bold text-slate-700 border border-slate-200 bg-slate-100/50">
                                            📐 평형 / 층수 / 입주일
                                        </td>
                                        {comparedLogs.map((log) => (
                                            <td key={log.id} className="p-3 border border-slate-200 space-y-1">
                                                <div><span className="text-slate-400">면적:</span> {log.area || '-'}</div>
                                                <div><span className="text-slate-400">층수:</span> {log.floorInfo || '-'}</div>
                                                <div><span className="text-slate-400">입주:</span> {log.moveInDate || '-'}</div>
                                            </td>
                                        ))}
                                    </tr>

                                    {/* 3. 입지 편의시설 충족도 */}
                                    <tr className="bg-slate-50/50">
                                        <td className="p-3 font-bold text-slate-700 border border-slate-200 bg-slate-100/50">
                                            🏪 입지 편의시설 충족도
                                        </td>
                                        {comparedLogs.map((log) => {
                                            const surroundings = log.surroundings || {};
                                            const checkedCount = SURROUNDINGS_ITEMS.filter(item => surroundings[item.id]).length;
                                            return (
                                                <td key={log.id} className="p-3 border border-slate-200 space-y-2">
                                                    <span className="inline-block bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-bold text-[11px]">
                                                        {checkedCount} / {SURROUNDINGS_ITEMS.length}개 항목 만족
                                                    </span>
                                                    <div className="flex flex-wrap gap-1">
                                                        {SURROUNDINGS_ITEMS.map(item => (
                                                            <span
                                                                key={item.id}
                                                                className={`px-1.5 py-0.5 rounded text-[10px] ${surroundings[item.id] ? 'bg-emerald-500 text-white font-bold' : 'bg-slate-100 text-slate-400 line-through'}`}
                                                            >
                                                                {item.label}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </td>
                                            );
                                        })}
                                    </tr>

                                    {/* 4. 내부 상태 요약 */}
                                    <tr>
                                        <td className="p-3 font-bold text-slate-700 border border-slate-200 bg-slate-100/50">
                                            🏠 내부 상태 점검 요약
                                        </td>
                                        {comparedLogs.map((log) => {
                                            const checks = Object.values(log.interiorChecks || {});
                                            const goodCount = checks.filter(c => c.status === 'good').length;
                                            const avgCount = checks.filter(c => c.status === 'average').length;
                                            const badCount = checks.filter(c => c.status === 'bad').length;

                                            return (
                                                <td key={log.id} className="p-3 border border-slate-200 space-y-1">
                                                    <div className="flex gap-1 text-[10px] font-bold">
                                                        <span className="px-1.5 py-0.5 bg-emerald-100 text-emerald-800 rounded">양호 {goodCount}</span>
                                                        <span className="px-1.5 py-0.5 bg-amber-100 text-amber-800 rounded">보통 {avgCount}</span>
                                                        <span className="px-1.5 py-0.5 bg-rose-100 text-rose-800 rounded">수리 {badCount}</span>
                                                    </div>
                                                    {badCount > 0 && (
                                                        <p className="text-[10px] text-rose-600 font-bold">⚠️ 수리필요 항목 존재</p>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>

                                    {/* 5. 별점 & 최종 의사결정 */}
                                    <tr className="bg-slate-50/50">
                                        <td className="p-3 font-bold text-slate-700 border border-slate-200 bg-slate-100/50">
                                            ⭐ 만족도 별점 / 최종결정
                                        </td>
                                        {comparedLogs.map((log) => (
                                            <td key={log.id} className="p-3 border border-slate-200 space-y-1">
                                                <div className="text-amber-500 font-bold text-sm">
                                                    {'★'.repeat(log.overallRating || 0)}
                                                    <span className="text-slate-600 text-xs ml-1">({log.overallRating}점)</span>
                                                </div>
                                                <div>
                                                    <span className="inline-block px-2.5 py-0.5 bg-indigo-600 text-white rounded-md font-bold text-[11px]">
                                                        {log.verdict || '미정'}
                                                    </span>
                                                </div>
                                            </td>
                                        ))}
                                    </tr>

                                    {/* 6. 핵심 장점 */}
                                    <tr>
                                        <td className="p-3 font-bold text-emerald-800 border border-slate-200 bg-emerald-50/40">
                                            👍 핵심 장점
                                        </td>
                                        {comparedLogs.map((log) => (
                                            <td key={log.id} className="p-3 border border-slate-200 text-slate-700 whitespace-pre-wrap leading-relaxed">
                                                {log.pros || <span className="text-slate-400 italic">미기재</span>}
                                            </td>
                                        ))}
                                    </tr>

                                    {/* 7. 핵심 단점 */}
                                    <tr className="bg-slate-50/50">
                                        <td className="p-3 font-bold text-rose-800 border border-slate-200 bg-rose-50/40">
                                            👎 핵심 단점
                                        </td>
                                        {comparedLogs.map((log) => (
                                            <td key={log.id} className="p-3 border border-slate-200 text-slate-700 whitespace-pre-wrap leading-relaxed">
                                                {log.cons || <span className="text-slate-400 italic">미기재</span>}
                                            </td>
                                        ))}
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
