<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 현장 조사 / 임장 노트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK (v9+/v10+ Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사진 속 민정님의 실제 Firebase 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyCLVntOsMvUw8i15a1...", // 이미지의 실제 키 자동 적용
            authDomain: "mj-3rd.firebaseapp.com",
            projectId: "mj-3rd",
            storageBucket: "mj-3rd.firebasestorage.app",
            messagingSenderId: "392748781039",
            appId: "1:392748781039:web:4e69d..."
        };

        // Firebase 초기화 및 Firestore 객체 생성
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const recordsCol = collection(db, "imjang_records");

        // 전역 스코프 등록 (HTML 버튼 이벤트용)
        window.saveRecord = async function() {
            const title = document.getElementById('recordTitle').value.trim();
            const location = document.getElementById('recordLocation').value.trim();
            const price = document.getElementById('recordPrice').value.trim();
            const memo = document.getElementById('recordMemo').value.trim();

            if (!title) {
                alert('매물명/제목을 입력해 주세요!');
                return;
            }

            try {
                await addDoc(recordsCol, {
                    title,
                    location,
                    price,
                    memo,
                    createdAt: serverTimestamp()
                });

                // 입력 필드 초기화
                document.getElementById('recordTitle').value = '';
                document.getElementById('recordLocation').value = '';
                document.getElementById('recordPrice').value = '';
                document.getElementById('recordMemo').value = '';
                alert('임장 기록이 등록되었습니다!');
            } catch (error) {
                console.error("저장 중 오류 발생:", error);
                alert("저장 실패: " + error.message);
            }
        };

        window.deleteRecord = async function(id) {
            if (confirm("이 기록을 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "imjang_records", id));
                } catch (error) {
                    console.error("삭제 실패:", error);
                }
            }
        };

        // 실시간 데이터 수신기
        onSnapshot(recordsCol, (snapshot) => {
            const listEl = document.getElementById('recordsList');
            const countEl = document.getElementById('totalCount');
            
            listEl.innerHTML = '';
            countEl.textContent = snapshot.docs.length;

            if (snapshot.empty) {
                listEl.innerHTML = `<div class="text-center py-8 text-gray-400">등록된 임장 기록이 없습니다. 새로 등록해 보세요!</div>`;
                return;
            }

            snapshot.docs.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-xl shadow-md hover:shadow-lg transition flex flex-col justify-between border border-gray-100';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold text-gray-800">${escapeHtml(data.title || '')}</h3>
                            <button onclick="deleteRecord('${id}')" class="text-red-400 hover:text-red-600 p-1">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                        ${data.location ? `<p class="text-sm text-gray-500 mb-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i>${escapeHtml(data.location)}</p>` : ''}
                        ${data.price ? `<p class="text-sm font-semibold text-indigo-600 mb-3"><i class="fas fa-won-sign mr-1"></i>${escapeHtml(data.price)}</p>` : ''}
                        ${data.memo ? `<p class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg whitespace-pre-wrap mb-2">${escapeHtml(data.memo)}</p>` : ''}
                    </div>
                `;
                listEl.appendChild(card);
            });
        });

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white py-6 shadow-md mb-8">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fas fa-building"></i> 부동산 현장 조사 (임장) 노트
                </h1>
                <p class="text-indigo-200 text-sm mt-1">Firebase 실시간 동기화 지원</p>
            </div>
            <div class="bg-indigo-700 px-4 py-2 rounded-lg text-sm font-medium">
                총 기록: <span id="totalCount" class="font-bold text-yellow-300">0</span>건
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- 입력 폼 -->
        <section class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-edit text-indigo-500"></i> 새 임장 작성
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">매물명 / 단지명 *</label>
                    <input type="text" id="recordTitle" placeholder="예: 래미안 아파트 101동" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">위치 / 주소</label>
                    <input type="text" id="recordLocation" placeholder="예: 서울시 마포구 ..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">매매가 / 보증금</label>
                    <input type="text" id="recordPrice" placeholder="예: 8.5억 / 전세 4억" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">현장 메모 및 평가</label>
                    <textarea id="recordMemo" rows="4" placeholder="채광, 조망, 주변 환경, 특이사항 등..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm outline-none resize-none"></textarea>
                </div>
                <button onclick="saveRecord()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> 기록 저장하기
                </button>
            </div>
        </section>

        <!-- 실시간 기록 리스트 -->
        <section class="md:col-span-2">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-list-alt text-indigo-500"></i> 실시간 임장 목록
            </h2>
            <div id="recordsList" class="grid grid-cols-1 gap-4">
                <div class="text-center py-8 text-gray-400">데이터를 불러오는 중입니다...</div>
            </div>
        </section>
    </main>
</body>
</html>
